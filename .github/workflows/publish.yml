name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional git tag to build and publish (e.g. v1.2.2; defaults to current ref)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Verify & build distribution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target ref
        uses: actions/checkout@v4
        with:
          ref: ${{ (github.event_name == 'workflow_dispatch' && inputs.tag != '') && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run syntax gate and unit tests
        run: |
          python -m compileall -q src tests scripts
          python -m unittest discover -s tests -v

      - name: Verify tag matches package version (when publishing a tag)
        env:
          INPUT_TAG: ${{ inputs.tag }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os, re, tomllib
          tag = os.environ.get("INPUT_TAG") or os.environ.get("RELEASE_TAG") or os.environ.get("GITHUB_REF_NAME", "")
          with open("pyproject.toml", "rb") as fh:
              version = tomllib.load(fh)["project"]["version"]
          if re.fullmatch(r"v\d+\.\d+\.\d+.*", tag):
              expected = f"v{version}"
              assert tag == expected, f"tag {tag!r} does not match pyproject.toml version {expected!r}"
          print(f"Verified version {version!r} for ref {tag!r}")
          PY

      - name: Build sdist + wheel and validate metadata
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-dists
          path: dist/*

  pypi-publish:
    name: Publish package to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/omada-mcp
    permissions:
      id-token: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/

      - name: Publish to PyPI via Trusted Publishing (OIDC)
        uses: pypa/gh-action-pypi-publish@release/v1
