name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Byte-compile (syntax gate)
        run: python -m compileall -q src tests

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Build wheel + sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Install the built wheel and smoke-test the CLI
        run: |
          python -m pip install --force-reinstall dist/*.whl
          omada-mcp --version
          omada-mcp --list-tools | python -c "import json,sys; d=json.load(sys.stdin); assert len(d['tools'])==8, len(d['tools'])"

  doctor-contract:
    name: doctor exit codes (no controller)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install from source
        run: python -m pip install .
      - name: Missing config must exit 2 and point at --doctor
        run: |
          set +e
          out=$(cd "$(mktemp -d)" && env -u OMADA_BASE_URL omada-mcp 2>&1)
          rc=$?
          set -e
          echo "$out"
          test "$rc" -eq 2
          echo "$out" | grep -q "omada-mcp --doctor"
      - name: --doctor with an unreachable controller must fail cleanly
        run: |
          set +e
          out=$(cd "$(mktemp -d)" && OMADA_BASE_URL=https://127.0.0.1:9 \
                OMADA_USERNAME=u OMADA_PASSWORD=p omada-mcp --doctor 2>&1)
          rc=$?
          set -e
          echo "$out"
          test "$rc" -eq 1
          echo "$out" | grep -q "FAIL"
          echo "$out" | grep -q "fix:"
