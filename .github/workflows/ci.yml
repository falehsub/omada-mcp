name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # Git Bash ships on the Windows runners, so one set of steps covers both
        # platforms (globs, printf, unset) without a pwsh duplicate of every step.
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        exclude:
          # Windows: keep the matrix at 8 jobs while still covering the oldest,
          # the CI default and the newest interpreter.
          - os: windows-latest
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Byte-compile (syntax gate)
        run: python -m compileall -q src tests

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Build wheel + sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Install the built wheel and smoke-test the CLI
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          omada-mcp --version
          omada-mcp --list-tools | python -c "import json,sys; d=json.load(sys.stdin); assert len(d['tools'])==20, len(d['tools'])"
          omada-mcp --list-tools --all | python -c "import json,sys; d=json.load(sys.stdin); assert len(d['tools'])==51, len(d['tools'])"

      - name: Stdio frames are LF-only and complete
        env:
          OMADA_BASE_URL: https://127.0.0.1:9
          OMADA_USERNAME: smoke
          OMADA_PASSWORD: smoke
          OMADA_READ_ONLY: "true"
        run: |
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18"}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            | omada-mcp > frames.jsonl
          python -c "raw=open('frames.jsonl','rb').read(); assert b'\r' not in raw, 'CRLF leaked into frames'; assert raw.endswith(b'\n'), 'frames not newline terminated'"
          python -c "import json; L=[json.loads(l) for l in open('frames.jsonl',encoding='utf-8') if l.strip()]; assert len(L)==2, len(L); assert L[0]['result']['serverInfo']['name']=='omada-mcp'; assert len(L[1]['result']['tools'])==20"
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' \
            | OMADA_READ_ONLY=false OMADA_WRITE_TOOLS=set_client_fixed_ip omada-mcp > frames-write.jsonl
          python -c "import json; L=[json.loads(l) for l in open('frames-write.jsonl',encoding='utf-8') if l.strip()]; assert len(L)==1, len(L); assert len(L[0]['result']['tools'])==21, len(L[0]['result']['tools'])"

      - name: Config discovery finds %APPDATA% (Windows only)
        if: runner.os == 'Windows'
        run: |
          mkdir -p "$APPDATA/omada-mcp"
          printf 'OMADA_BASE_URL=https://127.0.0.1:8043\nOMADA_USERNAME=win\nOMADA_PASSWORD=pw\n' > "$APPDATA/omada-mcp/.env"
          unset OMADA_ENV_FILE OMADA_BASE_URL OMADA_USERNAME OMADA_PASSWORD
          cd "$(mktemp -d)"
          omada-mcp --show-config | python -c "import json,sys; c=json.load(sys.stdin); assert c['username']=='win', c; assert 'AppData' in (c['env_file'] or ''), c['env_file']"

  doctor-contract:
    name: doctor exit codes (no controller)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install from source
        run: python -m pip install .
      - name: Missing config must exit 2 and point at --doctor
        run: |
          set +e
          out=$(cd "$(mktemp -d)" && env -u OMADA_BASE_URL omada-mcp 2>&1)
          rc=$?
          set -e
          echo "$out"
          test "$rc" -eq 2
          echo "$out" | grep -q "omada-mcp --doctor"
      - name: --doctor with an unreachable controller must fail cleanly
        run: |
          set +e
          out=$(cd "$(mktemp -d)" && OMADA_BASE_URL=https://127.0.0.1:9 \
                OMADA_USERNAME=u OMADA_PASSWORD=p omada-mcp --doctor 2>&1)
          rc=$?
          set -e
          echo "$out"
          test "$rc" -eq 1
          echo "$out" | grep -q "FAIL"
          echo "$out" | grep -q "fix:"
      - name: --doctor --json with an unreachable controller emits valid JSON and exits 1
        run: |
          set +e
          out=$(cd "$(mktemp -d)" && OMADA_BASE_URL=https://127.0.0.1:9 \
                OMADA_USERNAME=u OMADA_PASSWORD=p omada-mcp --doctor --json)
          rc=$?
          set -e
          echo "$out"
          test "$rc" -eq 1
          python -c "import json,sys; d=json.loads(sys.stdin.read()); assert d['status']=='fail' and d['exitCode']==1 and not d['ready']" <<< "$out"
