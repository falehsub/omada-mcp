name: Controller Compatibility Report
description: Submit a share-safe doctor report to verify a new Omada controller model or firmware version.
title: "[Controller Report]: <model> (<firmware>)"
labels: ["compatibility"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping grow the [`docs/compatibility.md`](https://github.com/falehsub/omada-mcp/blob/main/docs/compatibility.md) matrix!
        Run `omada-mcp --doctor --json --share-safe` for a public report with firmware, controller family, and phase status.

  - type: dropdown
    id: controller_type
    attributes:
      label: Controller model / deployment type
      options:
        - OC200 (hardware)
        - OC300 (hardware)
        - OC400 (hardware)
        - Software Controller (Linux / Docker)
        - Software Controller (Windows)
        - Omada Cloud / Cloud-Based Controller
        - Other
    validations:
      required: true

  - type: input
    id: controller_version
    attributes:
      label: Firmware & controller version
      description: Look for controllerVer in the share-safe report or Controller Settings → Maintenance.
      placeholder: "e.g. 5.14.32.2 (OC200 v1)"
    validations:
      required: true

  - type: textarea
    id: doctor_json
    attributes:
      label: "`omada-mcp --doctor --json --share-safe` output"
      description: 'Paste the JSON with `"shareSafe": true`.'
      render: json
    validations:
      required: true

  - type: textarea
    id: tool_checks
    attributes:
      label: Tool results & notes
      description: Optional summary of checks and controller error codes. Use anonymized examples for unexpected field shapes.
      placeholder: "All 10 tools worked / list_wlans returned ..."
    validations:
      required: false
